# CI pipeline (STORY-01.3, traces NFR-MNT-03).
#
# Every job drives the SAME `mise run <task>` scripts a developer runs locally,
# so CI and local never diverge. Gate/coverage/vuln logic lives in
# mise-tasks/ (and mise-tasks/lib/), never duplicated in this YAML. See
# docs/adr/0014-ci-drives-mise-tasks.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'  # matches go.mod (`go 1.22`, no toolchain); keep in sync with mise.toml
          cache: true
      - uses: jdx/mise-action@v2
      - run: mise run lint

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - uses: jdx/mise-action@v2
      # Unit tests + per-package coverage gate (70%). Identical to `mise run
      # coverage` locally; the gate skips not-yet-created packages.
      - run: mise run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  parser:
    # Python parsing-sidecar tests (STORY-05.3, ADR-0006). Same `mise run` task a
    # developer runs; mise provides the pinned Python from mise.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run test-parser

  web:
    # Admin UI (Next.js) unit tests + production build (STORY-11.1, SPEC-11
    # §7). Same `mise run` tasks a developer runs; mise provides the pinned
    # Node from mise.toml, so no separate actions/setup-node is needed. No
    # live stack required — this is the Vitest suite + `next build` only; the
    # live-stack Playwright golden path runs in the `web-e2e` job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run web-test
      - run: mise run web

  integration:
    # "integration tests against a Postgres service" (AC) = the //go:build e2e
    # suite against the real compose stack (Postgres+pgvector, MinIO, parser
    # sidecar). Running the real compose file keeps CI identical to local
    # (`mise run e2e` depends on `up` == `docker compose up`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - uses: jdx/mise-action@v2
      # `mise run e2e` depends on `up` (docker compose up -d --wait), so the
      # stack is stood up exactly as a developer would. Defaults suffice on a
      # clean runner (no port collisions), so no *_PORT overrides are needed.
      - run: mise run e2e
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Tear down stack
        if: always()
        run: mise run down || true

  web-e2e:
    # Playwright golden-path E2E for the admin UI (STORY-11.1 Task 8, SPEC-11
    # §7) against a real Next origin backed by a real `ragctl serve` + the
    # same compose stack `integration` uses. `mise run web-e2e` self-skips
    # without E2E_BASE_URL, so this job's own steps supply the whole live
    # stack it needs: the compose stack + migrations, a throwaway local(age)
    # DEK (mirrors test/e2e/secrets_e2e_test.go — `ragctl keys new-dek` wraps
    # it), `mise run seed` (platform admin + demo/acme tenants), the host API,
    # and the Next origin.
    runs-on: ubuntu-latest
    env:
      CONTROL_PLANE_URL: postgres://rag:rag@localhost:5432/control_plane?sslmode=disable
      PROVISION_DB_URL: postgres://rag:rag@localhost:5432/control_plane?sslmode=disable
      TENANT_DB_HOST: localhost
      TENANT_DB_PORT: "5432"
      TENANT_DB_SSLMODE: disable
      KMS_PROVIDER: local
      DEK_WRAPPED_PATH: /tmp/e2e-dek.age
      DEK_KEY_VERSION: "1"
      RAGCTL_ADDR: ":8091"
      RAGCTL_API_URL: http://localhost:8091
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - uses: jdx/mise-action@v2
      - run: mise run migrate
      - name: Generate a throwaway local(age) DEK for this run
        # A real age identity, not the placeholder in .env.example: `ragctl
        # keys new-dek` wraps a fresh DEK to its recipient below, and
        # AGE_SECRET_KEY (kept only in this job's env, masked in logs) is what
        # lets `ragctl serve`/enroll/seed unwrap it again. No `age-keygen` CLI
        # here — this repo's go.sum vendors the library import
        # (internal/crypto/kms.go) but not the CLI's extra x/term dependency.
        run: |
          set -euo pipefail
          cat > /tmp/gendek.go <<'EOF'
          package main

          import (
          	"fmt"
          	"os"

          	"filippo.io/age"
          )

          func main() {
          	id, err := age.GenerateX25519Identity()
          	if err != nil {
          		fmt.Fprintln(os.Stderr, err)
          		os.Exit(1)
          	}
          	fmt.Print(id.String())
          }
          EOF
          AGE_SECRET_KEY="$(go run /tmp/gendek.go)"
          echo "::add-mask::$AGE_SECRET_KEY"
          echo "AGE_SECRET_KEY=$AGE_SECRET_KEY" >> "$GITHUB_ENV"
      - run: go run ./cmd/ragctl keys new-dek --out "$DEK_WRAPPED_PATH"
      - run: mise run seed
      - name: Start the host API (RAGCTL_ADDR=:8091)
        # Runs `ragctl serve` directly (not `mise run api`, which requires a
        # .env file on disk) — every var it needs (RAGCTL_ADDR, CONTROL_PLANE_URL,
        # KMS_PROVIDER, DEK_*, AGE_SECRET_KEY) is already in this job's process
        # env (the job-level `env:` block plus $GITHUB_ENV above), so `go run`
        # picks them up with no .env file needed.
        run: |
          set -euo pipefail
          nohup go run ./cmd/ragctl serve > /tmp/ragctl-serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8091/healthz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "ragctl serve did not become healthy" >&2
          cat /tmp/ragctl-serve.log
          exit 1
      - name: Build and start the Next origin
        # The one and only `npm run build` for this job — `mise run web-e2e`
        # below runs with SKIP_WEB_BUILD=1 so it does NOT rebuild while this
        # `next start` is live serving the same web/.next (rebuilding under a
        # live server is a CI-flakiness source: a request can land mid-rewrite).
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build
          PORT=3000 nohup npx next start > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/admin/login >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "next did not become healthy" >&2
          cat /tmp/next.log
          exit 1
      - run: mise run web-e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          SKIP_WEB_BUILD: "1"
      - name: Server logs on failure
        if: failure()
        run: |
          cat /tmp/ragctl-serve.log || true
          cat /tmp/next.log || true
          docker compose logs --no-color || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: mise run down || true

  vuln:
    # Go dependency scanning (SPEC-09 §6). BLOCKING gate (STORY-10.6, ADR-0014
    # amended): `mise run vulncheck-gate` fails on a called vulnerability in a
    # non-stdlib module that is NOT in .ci/vuln-allowlist.txt, while Go stdlib
    # advisories and the Go-1.22 pin-locked dependency allowlist are surfaced in the
    # logs but do not fail. The allowlist shrinks as the Go pin advances.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - uses: jdx/mise-action@v2
      - run: mise run vulncheck-gate

  pip-audit:
    # Python (parser sidecar) dependency scanning (SPEC-09 §6, STORY-10.6). Blocks on
    # any known vulnerability in services/parser/requirements.txt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run pip-audit

  image:
    # Image build (no push) + vulnerability scan (SPEC-09 §6, STORY-10.6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile -t rag-platform/ragctl:ci .
      - name: Scan image (Trivy) — block on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: rag-platform/ragctl:ci
          severity: HIGH,CRITICAL
          # Only fixable findings block merge (parallels the govulncheck stdlib /
          # pin-locked exception): an unfixed base-image CVE cannot gate a merge.
          ignore-unfixed: true
          exit-code: '1'
          format: table

  backup-drill:
    # Monthly PITR restore drill script (STORY-10.5, NFR-REL-03). In CI (no
    # pgBackRest) `mise run backup-drill` validates the script is well-formed and
    # self-skips; the full restore drill runs on the monthly ops cadence where
    # pgBackRest + Postgres + the repo exist (docs/runbooks/backup-and-pitr.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run backup-drill

  eval-gate:
    # Eval quality gate for settings/chunking/retrieval changes (STORY-12.4,
    # FR-ADM-04, SPEC-06 §8, ADR-0072). `mise run eval-gate` runs `ragctl eval run
    # --json --gate .ci/eval-gate.json` and BLOCKS on a quality regression against
    # the committed minimum thresholds. On a keyless PR runner (no seeded tenant /
    # provider keys / DEK) it self-skips cleanly, exactly like backup-drill; it
    # blocks only on a real regression. Wire EVAL_GATE_SLUG + the ragctl connection/
    # provider secrets on the environment where a seeded eval tenant exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - uses: jdx/mise-action@v2
      - run: mise run eval-gate
        env:
          EVAL_GATE_SLUG: ${{ vars.EVAL_GATE_SLUG }}
          CONTROL_PLANE_URL: ${{ secrets.EVAL_GATE_CONTROL_PLANE_URL }}
