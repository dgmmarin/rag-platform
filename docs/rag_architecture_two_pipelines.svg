<svg width="100%" viewBox="0 0 680 566" role="img" xmlns="http://www.w3.org/2000/svg">
<title style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;">RAG architecture with indexing and query pipelines</title>
<desc style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;">An offline indexing pipeline ingests, parses, chunks, and embeds data into one Postgres chunks table (pgvector hnsw index + GIN full-text index); an online query pipeline optionally rewrites the question, retrieves with a single-round-trip hybrid query fused by RRF, optionally reranks, and generates a grounded, cited answer. Unchanged documents skip embedding; a no-hit query refuses without calling the LLM.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="135" y="36" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;">Indexing (offline)</text>
<text x="543" y="36" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;">Query (online)</text>

<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="40" y="54" width="190" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<text x="135" y="76" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500;">Data sources</text>
<text x="135" y="94" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px;">upload, crawl, sitemap, API, S3</text>
</g>
<line x1="135" y1="110" x2="135" y2="140" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>
<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="40" y="142" width="190" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<text x="135" y="164" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500;">Ingest &amp; parse</text>
<text x="135" y="182" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px;">Go parsers + Python sidecar</text>
</g>
<line x1="135" y1="198" x2="135" y2="228" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>
<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="40" y="230" width="190" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<text x="135" y="252" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500;">Chunk + enrich</text>
<text x="135" y="270" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px;">Structure-aware, heading path</text>
</g>
<line x1="135" y1="286" x2="135" y2="316" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>
<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="40" y="318" width="190" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<text x="135" y="340" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500;">Embed</text>
<text x="135" y="358" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px;">Batched, per-tenant provider</text>
</g>

<rect x="258" y="196" width="170" height="178" rx="16" stroke-dasharray="4 3" style="fill:rgb(252, 252, 251);stroke:rgba(11,11,11,0.2);stroke-width:0.5px;"/>
<text x="343" y="214" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;">One chunks table (Postgres)</text>
<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="270" y="230" width="146" height="56" rx="8" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:0.5px;"/>
<text x="343" y="252" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-size:14px;font-weight:500;">Vector index (hnsw)</text>
<text x="343" y="270" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-size:12px;">pgvector semantic</text>
</g>
<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="270" y="298" width="146" height="56" rx="8" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:0.5px;"/>
<text x="343" y="320" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-size:14px;font-weight:500;">Full-text index (GIN)</text>
<text x="343" y="338" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-size:12px;">tsvector, ts_rank_cd</text>
</g>

<line x1="230" y1="346" x2="256" y2="346" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>
<line x1="428" y1="246" x2="446" y2="246" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>

<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="448" y="54" width="190" height="44" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5px;"/>
<text x="543" y="76" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-size:14px;font-weight:500;">User question</text>
</g>
<line x1="543" y1="98" x2="543" y2="128" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>
<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="448" y="130" width="190" height="56" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5px;"/>
<text x="543" y="152" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-size:14px;font-weight:500;">Rewrite query</text>
<text x="543" y="170" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-size:12px;">Optional, history only</text>
</g>
<line x1="543" y1="186" x2="543" y2="216" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>
<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="448" y="218" width="190" height="56" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5px;"/>
<text x="543" y="240" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-size:14px;font-weight:500;">Hybrid retrieve</text>
<text x="543" y="258" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-size:12px;">RRF fusion, one round trip</text>
</g>
<line x1="543" y1="274" x2="543" y2="304" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>
<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="448" y="306" width="190" height="56" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5px;"/>
<text x="543" y="328" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-size:14px;font-weight:500;">Rerank</text>
<text x="543" y="346" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-size:12px;">Optional: Cohere / LLM listwise</text>
</g>
<line x1="543" y1="362" x2="543" y2="392" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>
<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="448" y="394" width="190" height="56" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5px;"/>
<text x="543" y="416" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-size:14px;font-weight:500;">LLM generate</text>
<text x="543" y="434" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-size:12px;">Grounded + cited</text>
</g>
<line x1="543" y1="450" x2="543" y2="480" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>
<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="448" y="482" width="190" height="44" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5px;"/>
<text x="543" y="504" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-size:14px;font-weight:500;">Answer + citations</text>
</g>

<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="258" y="396" width="170" height="54" rx="8" stroke-dasharray="4 3" style="fill:rgb(253, 248, 240);stroke:rgb(181, 141, 78);stroke-width:0.6px;"/>
<text x="343" y="414" text-anchor="middle" dominant-baseline="central" style="fill:rgb(150, 104, 40);font-size:11px;font-weight:600;">Indexing efficiency</text>
<text x="343" y="430" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120, 90, 40);font-size:11px;">sha256 match &#8594; skip</text>
<text x="343" y="443" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120, 90, 40);font-size:11px;">chunk + embed</text>
</g>
<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">
<rect x="258" y="462" width="170" height="54" rx="8" stroke-dasharray="4 3" style="fill:rgb(253, 248, 240);stroke:rgb(181, 141, 78);stroke-width:0.6px;"/>
<text x="343" y="480" text-anchor="middle" dominant-baseline="central" style="fill:rgb(150, 104, 40);font-size:11px;font-weight:600;">Query efficiency</text>
<text x="343" y="496" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120, 90, 40);font-size:11px;">no chunk &#8805; min_score &#8594;</text>
<text x="343" y="509" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120, 90, 40);font-size:11px;">refuse, no LLM call</text>
</g>
</svg>
