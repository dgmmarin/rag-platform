# pgBackRest configuration for RAG-platform tenant Postgres clusters.
# STORY-10.5, NFR-REL-03, ADR-0068.
#
# Repository = the platform MinIO/S3 object store. Backups are daily full plus
# continuous WAL archiving, retained 7 days for point-in-time recovery.
#
# Secrets and the deployment-specific S3 endpoint/bucket/region are NOT committed
# here: pgBackRest reads any option from a PGBACKREST_<OPTION> environment variable,
# so the repo credentials come from PGBACKREST_REPO1_S3_* set by the compose overlay
# (docker-compose.backup.yml) from the same MinIO creds the app uses. This file holds
# only non-secret policy.
#
# One stanza per Postgres CLUSTER that hosts tenant databases: pgBackRest backs up a
# cluster and its WAL stream, so a cluster's daily full + archived WAL covers EVERY
# tenant database on it with 7-day PITR (see README.md "Stanzas and the tenant
# fleet"). A shared cluster is one stanza; tenants isolated onto dedicated clusters
# (C-5) each get their own stanza + repo path.

[global]
repo1-type=s3
# MinIO (and most S3-compatibles) require path-style addressing.
repo1-s3-uri-style=path
repo1-path=/pgbackrest

# 7-day PITR (NFR-REL-03): retain the full backups AND the WAL needed to recover
# from them for the last 7 days. Raise for a longer recovery window.
repo1-retention-full-type=time
repo1-retention-full=7

# WAL archiving + backup ergonomics.
archive-async=y
start-fast=y
compress-type=zst
repo1-bundle=y
process-max=2
log-level-console=info
log-level-file=detail

# repo1-s3-endpoint / -bucket / -region / -key / -key-secret are supplied via the
# PGBACKREST_REPO1_S3_* environment variables (see the overlay). Do not commit them.

[global:archive-push]
compress-level=3

# --- Stanzas: one per Postgres cluster hosting tenant databases. --------------
# `main` is the local / single-cluster case (all tenant DBs in one cluster). In a
# fleet, add one section per cluster (e.g. [tenant-eu-1]) with its own pg1-path /
# pg1-port and a distinct repo1-path (via PGBACKREST_REPOn_*) so their WAL never mixes.
[main]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
