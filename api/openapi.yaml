                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: API key lacks the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: no such source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: a sync is already queued or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/sources/{id}/test:
    post:
      summary: Test a source's configuration and credentials.
      operationId: sourceTest
      tags:
        - sources
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Source id.
          schema:
            type: string
      responses:
        "200":
          description: connection ok
        "401":
          description: missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: API key lacks the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: no such source, or the connector framework is not available yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: rate limit exceeded
          content:
            application/json:
