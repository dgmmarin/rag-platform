                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: tenant is not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/sources:
    get:
      summary: List the tenant's sources.
      operationId: sourceList
      tags:
        - sources
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Page size (default 50, max 200).
          schema:
            type: integer
        - name: cursor
          in: query
          description: Opaque pagination cursor from a prior next_cursor.
          schema:
            type: string
      responses:
        "200":
          description: a page of sources ({items, next_cursor})
        "400":
          description: invalid limit or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: API key lacks the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      summary: Create a source (config validated by the connector).
      operationId: sourceCreate
      tags:
        - sources
      security:
        - bearerAuth: []
      responses:
        "201":
          description: source created
        "400":
          description: invalid source body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: API key lacks the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: a source with that name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/sources/{id}:
    get:
      summary: Get one source.
      operationId: sourceGet
      tags:
        - sources
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Source id.
          schema:
            type: string
      responses:
        "200":
          description: the source
        "401":
          description: missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: API key lacks the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: no such source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      summary: Update a source (includes pause/resume via status).
      operationId: sourceUpdate
      tags:
        - sources
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Source id.
          schema:
            type: string
      responses:
        "200":
          description: the updated source
        "400":
          description: invalid patch body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: API key lacks the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: no such source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: a source with that name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      summary: Delete a source (enqueues delete_source).
      operationId: sourceDelete
      tags:
        - sources
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Source id.
          schema:
            type: string
      responses:
        "202":
          description: deletion scheduled
        "401":
          description: missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: API key lacks the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: no such source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/sources/{id}/sync:
    post:
      summary: Start a manual sync (Idempotency-Key honoured).
      operationId: sourceSync
      tags:
        - sources
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Source id.
          schema:
            type: string
      responses:
        "202":
          description: sync job enqueued
        "401":
          description: missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: API key lacks the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: no such source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: a sync is already queued or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/sources/{id}/test:
    post:
      summary: Test a source's configuration and credentials.
      operationId: sourceTest
      tags:
        - sources
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Source id.
          schema:
            type: string
      responses:
        "200":
          description: connection ok
        "400":
          description: the connection or credential test failed; the envelope message is actionable (e.g. unreachable host, bad credentials)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: API key lacks the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: no such source, or the connector framework is not available yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/usage:
    get:
      summary: Daily usage rows for the authenticated tenant.
      operationId: usageList
      tags:
        - usage
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: Inclusive start date (YYYY-MM-DD).
          schema:
            type: string
        - name: to
          in: query
          description: Inclusive end date (YYYY-MM-DD).
          schema:
            type: string
      responses:
        "200":
          description: usage rows
        "401":
          description: missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: API key lacks the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    Chunk:
      properties:
        content:
          type: string
        document_id:
          type: string
        heading_path:
          items:
            type: string
          type: array
        id:
          type: string
        metadata:
          additionalProperties: true
          type: object
        score:
          description: Fused RRF score, or the reranker relevance score when reranking is enabled.
          type: number
        source_id:
          type: string
        title:
          type: string
        uri:
          type: string
      required:
        - id
        - document_id
        - source_id
        - content
        - uri
        - title
        - heading_path
        - score
      type: object
    Citation:
      properties:
        document_id:
          type: string
        heading_path:
          items:
            type: string
          type: array
        "n":
          description: The [n] marker used in the answer text.
          type: integer
        snippet:
          type: string
        title:
          type: string
        uri:
          type: string
      required:
        - "n"
        - document_id
        - title
        - uri
        - heading_path
        - snippet
      type: object
    ErrorEnvelope:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              enum:
                - unauthorized
                - forbidden
                - not_found
                - validation
                - rate_limited
                - tenant_unavailable
                - conflict
                - internal
              type: string
            message:
              type: string
            request_id:
              type: string
          required:
            - code
            - message
          type: object
      required:
        - error
      type: object
    FeedbackRequest:
      properties:
        comment:
          description: Optional free-text comment.
          type: string
        query_id:
          description: The id returned by POST /v1/query.
          type: string
        rating:
          description: 1 = thumbs up, -1 = thumbs down.
          enum:
            - 1
            - -1
          type: integer
      required:
        - query_id
        - rating
      type: object
    Filters:
      description: Optional retrieval filters (FR-RET-02). Any absent field is a no-op.
      properties:
        date_from:
          format: date-time
          type: string
        date_to:
          format: date-time
          type: string
        metadata:
          additionalProperties: true
          type: object
        source_ids:
          items:
            type: string
          type: array
        uri_prefix:
          type: string
      required: []
      type: object
    HistoryTurn:
      properties:
        content:
          type: string
        role:
          enum:
            - user
            - assistant
          type: string
      required:
        - role
        - content
      type: object
    QueryRequest:
      properties:
        filters:
          $ref: '#/components/schemas/Filters'
        history:
          description: Prior turns for a follow-up (used for the optional rewrite step).
          items:
            $ref: '#/components/schemas/HistoryTurn'
          type: array
        question:
          description: The natural-language question.
          type: string
        stream:
          description: When true the response is a text/event-stream (retrieval -> delta -> done) instead of JSON.
          type: boolean
        top_k:
          type: integer
      required:
        - question
      type: object
    QueryResponse:
      properties:
        answer:
          description: The grounded answer with [n] citation markers, or the fixed refusal when grounded is false.
          type: string
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          type: array
        grounded:
          type: boolean
        id:
          type: string
        model:
          type: string
        usage:
          $ref: '#/components/schemas/Usage'
      required:
        - id
        - answer
        - grounded
        - citations
        - usage
        - model
      type: object
    RetrieveRequest:
      properties:
        filters:
          $ref: '#/components/schemas/Filters'
        query:
          description: The search query text.
          type: string
        top_k:
          description: Max chunks to return; defaults to the tenant's retrieval.final_k.
          type: integer
      required:
        - query
      type: object
    RetrieveResponse:
      properties:
        chunks:
          items:
            $ref: '#/components/schemas/Chunk'
          type: array
      required:
        - chunks
      type: object
    Usage:
      properties:
        generation_ms:
          type: integer
        in_tokens:
          type: integer
        out_tokens:
          type: integer
        retrieval_ms:
          type: integer
      required:
        - retrieval_ms
        - generation_ms
        - in_tokens
        - out_tokens
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API key: Authorization: Bearer rk_<prefix>_<secret> (SPEC-07 §2, ADR-0021). Tenant is derived from the key.'
      bearerFormat: rk_<hexprefix>_<secret>
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Server-side session cookie (SPEC-09 §3). Mutations also require the X-CSRF-Token header.
