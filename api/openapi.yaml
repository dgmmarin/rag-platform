              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    ErrorEnvelope:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              enum:
                - unauthorized
                - forbidden
                - not_found
                - validation
                - rate_limited
                - tenant_unavailable
                - conflict
                - internal
              type: string
            message:
              type: string
            request_id:
              type: string
          required:
            - code
            - message
          type: object
      required:
        - error
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API key: Authorization: Bearer rk_<prefix>_<secret> (SPEC-07 §2, ADR-0021). Tenant is derived from the key.'
      bearerFormat: rk_<hexprefix>_<secret>
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Server-side session cookie (SPEC-09 §3). Mutations also require the X-CSRF-Token header.
