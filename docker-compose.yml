# Local development stack (STORY-01.2).
#
# Default `docker compose up` brings up infrastructure the host processes talk
# to: Postgres 16 + pgvector, MinIO, and the parsing sidecar stub. The app
# (`ragctl serve` / `ragctl work`) normally runs on the host under mprocs
# (`mise run dev`); it is also available here as the `app` profile
# (`docker compose --profile app up`, or `mise run up-app`) — see ADR-0011.
name: rag-platform

services:
  postgres:
    # VectorChord bundles pgvector + the vchord extension (vchordrq index has no
    # 2000-dim HNSW cap, so 4096-dim embeddings are indexable). Needs vchord in
    # shared_preload_libraries.
    image: tensorchord/vchord-postgres:pg16-v1.1.1
    command: ["postgres", "-c", "shared_preload_libraries=vchord"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-control_plane}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Seed: creates the control-plane DB + installs pgvector on first init.
      - ./deploy/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-control_plane}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      # NOTE: :9000 collides with other local MinIO instances. Override with
      # MINIO_PORT / MINIO_CONSOLE_PORT in .env (see .env.example).
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Parsing sidecar stub (Python). Health-only for now; the real POST /parse
  # (ADR-0006, SPEC-05 §3) arrives in STORY-05.3.
  parser:
    build: ./services/parser
    ports:
      - "${PARSER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/healthz').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # The app image (ragctl). Opt-in via the `app` profile so a stubbed `serve`
  # (ADR-0010) never blocks `docker compose up --wait` (ADR-0011).
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--addr", ":8080"]
    environment:
      CONTROL_PLANE_URL: postgres://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-control_plane}?sslmode=disable
      PARSER_URL: http://parser:8081
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      parser:
        condition: service_healthy

  # Local observability stack (Task 5). Opt-in via the `obs` profile so a
  # plain `docker compose up` is unaffected. Scrapes serve/worker metrics on
  # the host and tails .run/ job-event logs. Local-dev only.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["obs"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # Overridable to dodge collisions with other local stacks (see .env.example).
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.1.1
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/obs/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"

  promtail:
    image: grafana/promtail:3.1.1
    profiles: ["obs"]
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./deploy/obs/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./.run:/var/run-logs:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["obs"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/obs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # GRAFANA_PORT in .env if 3000 is taken by another local stack.
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
  miniodata:
  lokidata:
