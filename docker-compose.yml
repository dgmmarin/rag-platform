# Local development infrastructure (STORY-01.2).
# Application processes (api, worker) run on the host via mprocs, not here.
name: rag-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-control_plane}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Parsing sidecar (Python) — added in STORY-05.3. Uncomment once services/parser exists.
  # parser:
  #   build: ./services/parser
  #   ports:
  #     - "8081:8081"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

volumes:
  pgdata:
  miniodata:
