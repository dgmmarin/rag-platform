# `mise run dev` launches this. Each proc shells out to a mise task so there is
# one definition per command (in ./mise-tasks/).
procs:
  infra:
    # Postgres+pgvector, MinIO and the parsing sidecar stub (docker-compose.yml).
    # The containerised app is opt-in via the `app` profile (ADR-0011).
    shell: "docker compose up"
  api:
    shell: "mise run api"
    # serve now runs the scaffolding HTTP server (STORY-01.6: /healthz, /readyz,
    # /metrics + obs middleware) but requires a local DEK and is still pre-router;
    # left off by default until the full middleware chain lands (STORY-04.1).
    autostart: false
  worker:
    shell: "mise run worker"
    autostart: false   # ragctl work is a stub (STORY-01.1); enable in STORY-09.1
  web:
    shell: "mise run web-dev"
    # Admin UI (Next.js, EPIC-11): the BFF proxies to `api`'s RAGCTL_API_URL (default
    # http://localhost:8080), so bring `api` up alongside this. autostart off for the
    # same reason as `api` above (opt in once you want the UI running).
    autostart: false
